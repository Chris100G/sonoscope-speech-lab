name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff check app.py sonoscope tests scripts
      - run: python -m pytest -q
      - run: python scripts/smoke_test.py
      - run: python -m compileall -q app.py sonoscope scripts
